    var p = { 키: s.map(function (x) { return x.키; }).join('+'),
              이름: s[0].이름, 시작: s[0].시작, 종료: s[0].종료 || s[0].시작,
              정보: {}, 발신: [], 묶음: s.length };
    s.forEach(function (x) {
      p.발신 = p.발신.concat(x.발신);
      var 종료 = x.종료 || x.시작;
      if (종료 > p.종료) p.종료 = 종료;
    });
    for (var i = s.length - 1; i >= 0; i--) rvFill(p.정보, s[i].정보);
    return p;
  }

  /**
   * 비교대상 칸에 적힌 이름을 리뷰 시트에서 찾습니다.
   * 같은 이름이 여러 묶음으로 나뉘어 있으면 기간이 붙은 것끼리 합쳐 돌려줍니다.
   * 지금 보고 있는 프로모션이 든 묶음은 건너뜁니다 — 자기 자신과는 비교하지 않고,
   * 같은 이름의 지난 런칭이 있으면 그쪽을 잡습니다.
   */
  function rvFindPromo(name, 제외키) {
    var want = rvNorm(splitName(name).이름);
    if (!want || !REVIEW) return null;
    var 정확 = [], 부분 = [];
    REVIEW.forEach(function (p) {
      var got = rvNorm(p.이름);
      if (got === want) 정확.push(p);
      else if (got.indexOf(want) >= 0 || want.indexOf(got) >= 0) 부분.push(p);
    });
    var 후보 = 정확.length ? 정확 : 부분;
    if (!후보.length) return null;
    var 덩어리 = rvClusters(후보).filter(function (c) {
      return !제외키 || c.every(function (p) { return p.키 !== 제외키; });
    });
    if (!덩어리.length) return null;
    return rvMergePromos(덩어리[덩어리.length - 1]);   /* 가장 최근 덩어리 */
  }

  function renderKpis(A) {
    var last = A.n - 1;
    var today = A.n ? A.dayTot[last] : 0;
    var sum = sumOf(A.dayTot, A.n);
    var avg = A.n ? sum / A.n : 0;
    var prev = last - 7 >= 0 ? A.dayTot[last - 7] : null;
    var prevDate = last - 7 >= 0 ? A.win[last - 7] : null;

    var bi = -1, bv = -Infinity;
    for (var i = 0; i < A.chs.length; i++) {
      var v = A.n ? A.chV[i][last] : 0;
      if (v > bv) { bv = v; bi = i; }
    }
    var isAmt = state.metric === 'amt';
    var fig = function (v) { return (isAmt ? '₩' : '') + nf.format(Math.round(v)); };
    var unit = isAmt ? '' : '개';

    var t = [
      ['당일 총 ' + (isAmt ? '주문금액' : '주문수량'), fig(today), unit,
       '일평균 대비 ' + chip(avg ? (today - avg) / avg : null)],
      ['기간 일평균', fig(avg), unit, '<span class="chip flat">' + A.n + '일 평균</span>'],
      ['전주 동요일 대비',
       prev ? pctSigned((today - prev) / prev) : '—', '',
       prev != null ? '<span class="chip flat">' + md(prevDate) + ' ' + fig(prev) + unit + '</span>'
                    : '<span class="chip flat">기간 밖</span>'],
      ['당일 1위 판매처', bi >= 0 && bv > 0 ? A.chs[bi] : '—', '',
       bi >= 0 && bv > 0
         ? '<span class="chip flat">' + fig(bv) + unit + ' · 비중 ' +
           (today ? (bv / today * 100).toFixed(0) : 0) + '%</span>'
         : '<span class="chip flat">주문 없음</span>']
    ];
    document.getElementById('kpis').innerHTML = t.map(function (x) {
      var big = String(x[1]);
      var isHtml = big.charAt(0) === '<';           /* pctSigned 는 색과 기호를 담은 조각입니다 */
      var plainLen = isHtml ? big.replace(/<[^>]*>/g, '').length : big.length;
      return '<div class="kpi"><div class="k">' + esc(x[0]) + '</div><div class="v num' +
             (plainLen > 10 ? ' long' : '') + '">' + (isHtml ? big : esc(big)) +
             (x[2] ? '<small>' + x[2] + '</small>' : '') +
             '</div><div class="d">' + x[3] + '</div></div>';
    }).join('');
  }

  /* ── 추이 : 판매처 누적막대 + 총액 선 + 일평균 점선 ─────── */
  function renderTrend(A) {
    var svg = document.getElementById('trend');
    /* mt 는 TODAY 글자 자리, mb 는 45도로 기울인 날짜 자리입니다 */
    var W = 1000, H = 330, ml = 74, mr = 16, mt = 30, mb = 62;
    if (!A.n) { svg.innerHTML = ''; document.getElementById('trendAvg').textContent = ''; return; }
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);

    var posMax = 1, negMin = 0, k2, i2, v2, ps, ns;
    for (k2 = 0; k2 < A.n; k2++) {
      ps = 0; ns = 0;
      for (i2 = 0; i2 < A.chs.length; i2++) {
        v2 = A.chV[i2][k2];
        if (v2 > 0) ps += v2; else ns += v2;
      }
      if (ps > posMax) posMax = ps;
      if (ns < negMin) negMin = ns;
    }
    var top = posMax * 1.08, bottom = negMin * 1.15;
    var band = (W - ml - mr) / A.n;
    var bw = Math.max(3, Math.min(30, band * 0.68));
    var cx = function (k) { return ml + band * (k + 0.5); };
    var y = function (v) { return H - mb - ((v - bottom) / (top - bottom)) * (H - mt - mb); };

    var o = '', t, yy;

    /* TODAY 하이라이트 — 가장 먼저 그려서 막대와 선 뒤에 놓습니다 */
    var hlW = bw * 1.6;
    var hlX = cx(A.n - 1) - hlW / 2;
    var hlTop = y(top);
    o += '<rect x="' + hlX.toFixed(1) + '" y="' + hlTop.toFixed(1) +
         '" width="' + hlW.toFixed(1) + '" height="' + ((H - mb) - hlTop).toFixed(1) +
         '" fill="var(--today-hl)" style="opacity:var(--today-hl-op)" stroke="none" pointer-events="none"/>';
    o += '<text x="' + cx(A.n - 1).toFixed(1) + '" y="' + (hlTop - 8).toFixed(1) +
         '" text-anchor="middle" textLength="' + hlW.toFixed(1) + '" lengthAdjust="spacingAndGlyphs"' +
         ' style="fill:var(--ink);font-weight:800;font-size:11px" pointer-events="none">TODAY</text>';

    for (t = 0; t <= 4; t++) {
      yy = y(top * t / 4);
      o += '<line class="gridline" x1="' + ml + '" y1="' + yy.toFixed(1) + '" x2="' + (W - mr) +
           '" y2="' + yy.toFixed(1) + '"/>' +
           '<text x="' + (ml - 8) + '" y="' + (yy + 3.5).toFixed(1) + '" text-anchor="end">' +
           compact(top * t / 4) + '</text>';
    }

    var segs = [];
    for (var k = 0; k < A.n; k++) {
      var accP = 0, accN = 0, total = A.dayTot[k];
      for (var i = 0; i < A.chs.length; i++) {
        var v = A.chV[i][k];
        if (!v) continue;
        var y0, y1;
        if (v > 0) { y0 = y(accP); y1 = y(accP + v); accP += v; }
        else       { y1 = y(accN); y0 = y(accN + v); accN += v; }
        var h = Math.max(1.5, Math.abs(y0 - y1) - 2);
        segs.push({ k: k, i: i, v: v, total: total });
        o += '<rect x="' + (cx(k) - bw / 2).toFixed(1) + '" y="' + Math.min(y0, y1).toFixed(1) +
             '" width="' + bw.toFixed(1) + '" height="' + h.toFixed(1) +
             '" fill="' + chColor(A.chs[i]) + '"' +
             (v < 0 ? ' opacity=".55"' : '') +
             ' data-s="' + (segs.length - 1) + '"></rect>';
      }
    }
    if (negMin < 0) {
      o += '<line x1="' + ml + '" y1="' + y(0).toFixed(1) + '" x2="' + (W - mr) +
           '" y2="' + y(0).toFixed(1) + '" stroke="var(--border)" stroke-width="1"/>';
    }

    /* 일일 총액 선 */
    var pts = A.dayTot.map(function (v, k) { return cx(k).toFixed(1) + ',' + y(v).toFixed(1); });
    o += '<polyline points="' + pts.join(' ') + '" fill="none" stroke="var(--ink)" stroke-width="2" ' +
         'stroke-linejoin="round" stroke-linecap="round" opacity=".82" pointer-events="none"/>';
    o += '<circle cx="' + cx(A.n - 1).toFixed(1) + '" cy="' + y(A.dayTot[A.n - 1]).toFixed(1) +
         '" r="4.5" fill="var(--ink)" stroke="var(--surface)" stroke-width="2" pointer-events="none"/>';

    /* 일평균 점선 (투명도 50%) — 값 라벨은 그래프에 가려지므로 카드 제목 우측에 둡니다 */
    var avg = A.n ? sumOf(A.dayTot, A.n) / A.n : 0;
    var ay = y(avg);
    o += '<line x1="' + ml + '" y1="' + ay.toFixed(1) + '" x2="' + (W - mr) + '" y2="' + ay.toFixed(1) +
         '" stroke="var(--ink)" stroke-width="2" stroke-dasharray="6 4" opacity=".5" pointer-events="none"/>';
    document.getElementById('trendAvg').innerHTML =
      '일평균 ' + (state.metric === 'amt' ? money(avg) : qtyFmt(avg) + '개');

    o += '<line class="axis" x1="' + ml + '" y1="' + (H - mb) + '" x2="' + (W - mr) + '" y2="' + (H - mb) + '"/>';

    /* 날짜는 하나도 빠짐없이, 45도로 기울여 표시합니다 */
    A.win.forEach(function (d, k) {
      var lx = cx(k).toFixed(1), ly = (H - mb + 12).toFixed(1);
      o += '<text x="' + lx + '" y="' + ly + '" text-anchor="end" ' +
           'transform="rotate(-45 ' + lx + ' ' + ly + ')" style="font-size:9.5px">' + md(d) + '</text>';
    });
    svg.innerHTML = o;

    var tip = document.getElementById('trendTip');
    var uu = state.metric === 'amt' ? '원' : '개';
    var plain = function (v) { return nf.format(Math.round(v)) + uu; };

    svg.onpointermove = function (e) {
      var box = svg.getBoundingClientRect();
      var rect = e.target.closest('rect[data-s]');
      var html, px, py;

      if (rect) {
        var s = segs[+rect.dataset.s], d = A.win[s.k];
        html = '<div class="t-d">' + d + ' ' + md(d) + '</div><strong>' + esc(A.chs[s.i]) +
               '</strong> · <span class="num">' + plain(s.v) +
               '</span> · 비중 ' + (s.total ? (s.v / s.total * 100).toFixed(1) : '0.0') + '%' +
               '<div class="t-m">일일 총 ' + plain(s.total) + '</div>';
        var rb = rect.getBoundingClientRect();
        px = rb.left - box.left + rb.width / 2;
        py = rb.top - box.top;
      } else {
        var kk = Math.floor(((e.clientX - box.left) / box.width * W - ml) / band);
        kk = Math.max(0, Math.min(A.n - 1, kk));
        var dd = A.win[kk], dt = A.dayTot[kk];
        var list = [];
        for (var q = 0; q < A.chs.length; q++) {
          if (A.chV[q][kk]) list.push({ c: A.chs[q], v: A.chV[q][kk] });
        }
        list.sort(function (a, b) { return b.v - a.v; });
        html = '<div class="t-d">' + dd + ' ' + md(dd) + '</div><strong class="num">' + plain(dt) + '</strong>' +
               '<div class="t-rows">' + list.map(function (r) {
                 return '<div><i style="background:' + chColor(r.c) + '"></i><span>' + esc(r.c) +
                        '</span><b class="num">' + nf.format(Math.round(r.v)) + '</b><em>' +
                        (dt ? (r.v / dt * 100).toFixed(1) : '0.0') + '%</em></div>';
               }).join('') + '</div>';
        px = cx(kk) / W * box.width;
        py = y(Math.max(0, dt)) / H * box.height - 10;
      }
      tip.innerHTML = html;
      tip.style.left = px + 'px';
      tip.style.top = py + 'px';
      tip.style.opacity = '1';
    };
    svg.onpointerleave = function () { tip.style.opacity = '0'; };

    var items = [];
    for (var g = 0; g < A.chs.length; g++) {
      if (!A.chTot[g]) continue;
      items.push('<span><i style="background:' + chColor(A.chs[g]) + '"></i>' + esc(A.chs[g]) + '</span>');
    }
    items.push('<span><i style="background:var(--ink);opacity:.82;height:3px;border-radius:2px"></i>' +
               '일일총주문금액</span>');
    items.push('<span><i class="dash"></i>일평균</span>');
    document.getElementById('trendLegend').innerHTML = items.join('');
  }

  /* ── 표1 : 날짜 × 판매처 (합계 열이 맨 앞) ───────────────── */
  function renderM1(A, anchor) {
    var cols = [];
    for (var i = 0; i < A.chs.length; i++) if (A.chTot[i] !== 0) cols.push(i);

    var isMonth = !!state.month;
    var lastIdx = A.n - 1;
    var al = alignCls();

    /* 열별 색 스케일 — 각 판매처 열의 최대값이 가장 진한 단계입니다.
       농도는 알파(최대 0.5)로만 올리므로 글자가 흰색으로 바뀔 일이 없습니다.
       합계 열과 통계 행은 비교 대상이 아니라 기준선이라 칠하지 않고,
       판매처를 하나만 골랐을 때도 비교 대상이 없어 칠하지 않습니다. */
    var scaleOn = (state.ch === '');
    var colMax = cols.map(function (i) {
      var m = 0, j;
      for (j = 0; j < A.n; j++) if (A.chV[i][j] > m) m = A.chV[i][j];
      return m;
    });
    function scaleStyle(v, ci) {
      if (!scaleOn || !(v > 0) || !colMax[ci]) return '';
      return ' style="background-color:rgba(var(--scale-rgb),' +
             ((v / colMax[ci]) * 0.5).toFixed(3) + ')"';
    }

    var avg = cols.map(function (i) { return avgOf(A.chV[i], A.chHas[i], A.n); });
    var totAvg = A.n ? sumOf(A.dayTot, A.n) / A.n : 0;
    var sums = cols.map(function (i) { return sumOf(A.chV[i], A.n); });
    var grand = sumOf(A.dayTot, A.n);

    var head = '<thead><tr><th class="stick">날짜</th>' +
      '<th class="totcol">합계</th>' +
      cols.map(function (i) {
        return '<th class="chlink" data-ch="' + esc(A.chs[i]) + '" title="클릭하면 상세로 이동합니다">' +
               '<span>' + esc(A.chs[i]) + '</span></th>';
      }).join('') + '</tr></thead>';

    /* 통계 행 */
    function rowAvg(pos) {
      return '<tr class="stat ' + pos + '"><td class="c stick">일평균</td>' +
        '<td class="num totcol' + al + '">' + val(totAvg) + '</td>' +
        avg.map(function (v) { return '<td class="num' + al + '">' + val(v) + '</td>'; }).join('') + '</tr>';
    }
    function rowDelta(pos) {
      return '<tr class="stat ' + pos + '"><td class="c stick">일평균 대비</td>' +
        '<td class="totcol c">' + chip(totAvg ? (A.dayTot[lastIdx] - totAvg) / totAvg : null) + '</td>' +
        avg.map(function (v, k) {
          return '<td class="c">' + chip(v ? (A.chV[cols[k]][lastIdx] - v) / v : null) + '</td>';
        }).join('') + '</tr>';
    }
    function rowSum(pos) {
      return '<tr class="stat ' + pos + '"><td class="c stick">합계</td>' +
        '<td class="num totcol' + al + '">' + val(grand) + '</td>' +
        sums.map(function (v) { return '<td class="num' + al + '">' + val(v) + '</td>'; }).join('') + '</tr>';
    }

    /* 날짜 행 — 최근 30일은 내림차순, 월 기준은 오름차순 */
    var body = '';
    var csv = [['날짜', '합계'].concat(cols.map(function (i) { return A.chs[i]; }))];
    var seq = dateSeq(A.n);
    for (var s = 0; s < seq.length; s++) {
      var j = seq[s];
      var d = A.win[j];
      var tm = memoAt(d, TOTAL_KEY);
      body += '<tr class="' + (d === anchor ? 'today' : '') + '">' +
              '<td class="c stick num">' + d.slice(5) +
              '<span style="color:var(--ink-muted)">' + md(d).slice(-3) + '</span></td>' +
              '<td class="num totcol' + al + (tm ? ' hasmemo' : '') + '"' +
              (tm ? ' data-md="' + d + '" data-mc="' + TOTAL_KEY + '" tabindex="0"' : '') +
              '><strong>' + val(A.dayTot[j]) + '</strong></td>';
      var line = [d, A.dayTot[j]];
      for (var q = 0; q < cols.length; q++) {
        var ci = cols[q], v = A.chV[ci][j], has = A.chHas[ci][j];
        var m = memoAt(d, A.chs[ci]);
        body += '<td class="num' + al + (has ? '' : ' zero') + (m ? ' hasmemo' : '') + '"' +
                (m ? ' data-md="' + d + '" data-mc="' + esc(A.chs[ci]) + '" tabindex="0"' : '') +
                scaleStyle(v, q) + '>' +
                (has ? (v ? val(v) : '0') : '·') + '</td>';
        line.push(has ? v : '');
      }
      body += '</tr>';
      csv.push(line);
    }

    /* 최근 30일 : 일평균·일평균대비를 맨 위 / 월 기준 : 합계·일평균을 맨 밑 */
    var html = head + '<tbody>' +
      (isMonth ? body + rowSum('bottom') + rowAvg('bottom')
               : rowAvg('top') + rowDelta('top') + body) + '</tbody>';

    var m1 = document.getElementById('m1');
    m1.innerHTML = html;
    Array.prototype.forEach.call(m1.querySelectorAll('th.chlink'), function (th) {
      th.onclick = function () { state.ch = th.dataset.ch; syncUrl(); render(); window.scrollTo(0, 0); };
    });
    document.getElementById('m1Note').textContent =
      '단위: ' + (state.metric === 'amt' ? '원' : '개') +
      ' · 날짜 ' + (isMonth ? '오름차순' : '내림차순') +
      ' · 판매처 이름을 클릭하면 상세로 이동합니다';

    if (isMonth) {
      csv.push(['합계', grand].concat(sums));
      csv.push(['일평균', totAvg].concat(avg));
    } else {
      csv.unshift(['일평균', totAvg].concat(avg));
      csv.unshift(['일평균대비', totAvg ? (A.dayTot[lastIdx] - totAvg) / totAvg : ''].concat(
        avg.map(function (v, k) { return v ? (A.chV[cols[k]][lastIdx] - v) / v : ''; })));
    }
    csvCache.m1 = { name: '판매처별_' + (state.metric === 'amt' ? '금액' : '수량'), rows: csv };
  }

  /**
   * 최근 30일 화면에서 일평균·일평균 대비 행을 제목행 바로 아래에 붙여둡니다.
   * 행 높이는 글꼴과 화면 폭에 따라 달라지므로 그릴 때마다 실측해서 오프셋을 잡습니다.
   * (월 기준 화면은 통계 행이 맨 밑이라 고정하지 않습니다)
   */
  /** 가로 스크롤이 걸린 상자인지 — 이 안에서는 top 오프셋의 기준이 화면이 아니라 상자입니다 */
  function isScrollBox(el) {
    if (!el) return false;
    var o = getComputedStyle(el).overflowX;
    return o === 'auto' || o === 'scroll';
  }

  function stickStatRows() {
    var tbl = document.getElementById('m1');
    var headRow = tbl.querySelector('thead tr');
    var box = document.querySelector('#m1Card .tablewrap');

    /* 상단에 이미 떠 있는 것들 아래로 붙여야 겹치지 않습니다 */
    var dock = document.querySelector('.controls-dock');
    var note = document.getElementById('noteFlo');
    var dockH = dock ? dock.getBoundingClientRect().height : 0;
    note.style.top = dockH + 'px';
    var base = dockH + (note.hidden ? 0 : note.getBoundingClientRect().height + 14);

    /* 표가 가로 스크롤 상자 안에 있으면(좁은 화면) 오프셋 기준이 상자로 바뀝니다.
       그대로 두면 제목행과 통계행이 상자 안에서 그만큼 아래로 밀려
       맨 위 날짜들을 덮어버립니다. 그때는 고정을 걸지 않습니다. */
    var docked = !isScrollBox(box);

    if (headRow) {
      Array.prototype.forEach.call(headRow.children, function (th) {
        th.style.top = docked ? base + 'px' : '0px';
      });
    }

    var off = base + (headRow ? headRow.getBoundingClientRect().height : 0);
    Array.prototype.forEach.call(tbl.querySelectorAll('tbody tr.stat.top'), function (tr) {
      Array.prototype.forEach.call(tr.children, function (td) {
        if (docked) {
          td.style.position = 'sticky';
          td.style.top = off + 'px';
          td.style.zIndex = td.classList.contains('stick') ? '5' : '4';
        } else {
          td.style.position = '';
          td.style.top = '';
          td.style.zIndex = '';
        }
      });
      off += tr.getBoundingClientRect().height;
    });

    /* 상품표는 늘 가로 스크롤 상자 안이라 제목행이 상자 맨 위에 붙어야 합니다 */
    var h2 = document.querySelector('#m2 thead tr');
    if (h2) Array.prototype.forEach.call(h2.children, function (th) { th.style.top = '0px'; });
  }

  /**
   * 교차표의 좌측 고정 4열 위치를 실측해서 맞춥니다.
   * 상품명 폭을 고정하지 않아(잘리면 안 되므로) 뒤 열의 left 를 미리 못 박을 수 없습니다.
   */
  function fitCrossSticky() {
    var tbl = document.getElementById('x');
    var row = tbl.querySelector('tbody tr');
    if (!row || row.children.length < 4) return;
    if (getComputedStyle(row.children[0]).position !== 'sticky') return;   /* 좁은 화면 */

    var w = [];
    for (var i = 0; i < 4; i++) w.push(row.children[i].getBoundingClientRect().width);
    var left = [0, w[0], w[0] + w[1], w[0] + w[1] + w[2]];
    ['x1', 'x2', 'x3', 'x4'].forEach(function (cls, i) {
      Array.prototype.forEach.call(tbl.querySelectorAll('.' + cls), function (c) {
        c.style.left = left[i] + 'px';
      });
    });
  }

  /* ── 표2 : 상품 × 날짜 ──────────────────────────────────── */
  function renderM2(A, anchor) {
    var order = [];
    for (var i = 0; i < A.prods.length; i++) if (A.pTot[i] !== 0) order.push(i);
    order.sort(function (a, b) { return A.pTot[b] - A.pTot[a]; });
    var al = alignCls();
    var chForMemo = state.ch;

    var seq = dateSeq(A.n);

    var head = '<thead><tr>' +
      '<th class="p1">제품라인</th><th class="p2">상품코드</th>' +
      '<th class="p3">상품명</th><th class="p4">정상가</th>' +
      '<th class="p5">일평균</th><th class="p6">합계</th>';
    var csvHead = ['제품라인', '상품코드', '상품명', '정상가', '일평균', '합계'];
    seq.forEach(function (j) {
      var d = A.win[j];
      var dm = chForMemo ? memoDateOnly(d, chForMemo) : null;
      head += '<th' + (dm ? ' class="hasmemo" data-md="' + d + '" data-mc="' + esc(chForMemo) +
              '" tabindex="0"' : '') + '>' + md(d) + '</th>';
      csvHead.push(d);
    });
    head += '</tr></thead>';

    var body = '', csv = [csvHead];
    order.forEach(function (pi) {
      var p = A.prods[pi];
      var pavg = avgOf(A.pV[pi], A.pHas[pi], A.n);
      var psum = A.pTot[pi];
      body += '<tr><td class="l p1"><span class="line-tag">' + esc(p[0] || '—') + '</span></td>' +
              '<td class="l p2 code num">' + esc(p[1]) + '</td>' +
              '<td class="l p3" title="' + esc(p[2]) + '">' + esc(p[2]) + '</td>' +
              '<td class="num p4">' + (p[3] ? '₩' + nf.format(p[3]) : '') + '</td>' +
              '<td class="num p5' + al + '">' + val(pavg) + '</td>' +
              '<td class="num p6' + al + '"><strong>' + val(psum) + '</strong></td>';
      var row = [p[0], p[1], p[2], p[3] || '', pavg, psum];
      seq.forEach(function (k) {
        var v = A.pV[pi][k], dd = A.win[k];
        var cm = chForMemo ? memoAt(dd, chForMemo, p[1], p[0]) : null;
        body += '<td class="num' + al + (v ? '' : ' zero') + (cm ? ' hasmemo' : '') + '"' +
                (cm ? ' data-md="' + dd + '" data-mc="' + esc(chForMemo) + '" data-mp="' + esc(p[1]) +
                      '" data-ml="' + esc(p[0] || '') + '" tabindex="0"' : '') +
                '>' + (v ? val(v) : '·') + '</td>';
        row.push(v || '');
      });
      body += '</tr>';
      csv.push(row);
    });

    document.getElementById('m2').innerHTML = head + '<tbody>' + body + '</tbody>';
    csvCache.m2 = { name: (state.ch || '전체') + '_상품별_' + (state.metric === 'amt' ? '금액' : '수량'),
                    rows: csv };
  }

  /* ═══════════════════════════════════════════════════════
     메모 팝업 — 셀을 누르면 열리고 다시 누르면 닫힙니다
     ═══════════════════════════════════════════════════════ */
  var openCell = null, popEl = null;

  function closeMemo() {
    if (popEl) { popEl.remove(); popEl = null; }
    if (openCell) { openCell.classList.remove('open'); openCell = null; }
  }

  function openMemo(cell) {
    if (cell.dataset.rvm !== undefined) return openReviewMemo(cell);
    var d = cell.dataset.md, ch = cell.dataset.mc;
    var code = cell.dataset.mp || '', line = cell.dataset.ml || '';
    var list = memoAt(d, ch, code, line) || memoAt(d, ch) || [];
    if (!list.length) return;

    /* 같은 메모가 여러 제품라인·상품코드에 걸려 있으면 판매처 표에서는 한 번만 보여줍니다 */
    var texts = [], seenTxt = {};
    list.forEach(function (m) {
      if (seenTxt[m.text]) return;
      seenTxt[m.text] = 1;
      texts.push(m.html || escBr(m.text));
    });

    closeMemo();
    openCell = cell;
    cell.classList.add('open');

    popEl = document.createElement('div');
    popEl.className = 'memopop';
    popEl.innerHTML = '<div class="mp-h">' + md(d) + ' · ' + esc(ch) +
      (line ? ' · ' + esc(line) : '') + (code ? ' · ' + esc(code) : '') + '</div>' +
      texts.map(function (x) { return '<div class="mp-t">' + x + '</div>'; }).join('');
    document.body.appendChild(popEl);

    var r = cell.getBoundingClientRect(), pr = popEl.getBoundingClientRect();
    var left = Math.min(Math.max(8, r.left), window.innerWidth - pr.width - 8);
    var top = r.bottom + 6;
    if (top + pr.height > window.innerHeight - 8) top = Math.max(8, r.top - pr.height - 6);
    popEl.style.left = left + 'px';
    popEl.style.top = top + 'px';
  }

  /** 리뷰 카드의 메모 — 머리글에 프로모션명과 항목을 적습니다 */
  function openReviewMemo(cell) {
    var list = String(cell.dataset.rvm).split(',').map(function (i) { return rvMemoBag[+i]; })
                 .filter(Boolean);
    if (!list.length) return;
    closeMemo();
    openCell = cell;
    cell.classList.add('open');

    var 첫 = list[0];
    popEl = document.createElement('div');
    popEl.className = 'memopop';
    popEl.innerHTML = '<div class="mp-h">' + esc(첫.이름) +
      (첫.항목 ? ' · ' + esc(첫.항목) : '') + '</div>' +
      list.map(function (m) {
        return '<div class="mp-t">' + (m.본문 || esc(m.메모)) + rvMemoWho(m) + '</div>';
      }).join('');
    document.body.appendChild(popEl);
    위치잡기(cell);
  }

  function 위치잡기(cell) {
    var r = cell.getBoundingClientRect(), pr = popEl.getBoundingClientRect();
    var left = Math.min(Math.max(8, r.left), window.innerWidth - pr.width - 8);
    var top = r.bottom + 6;
    if (top + pr.height > window.innerHeight - 8) top = Math.max(8, r.top - pr.height - 6);
    popEl.style.left = left + 'px';
    popEl.style.top = top + 'px';
  }

  document.addEventListener('click', function (e) {
    var cell = e.target.closest('.hasmemo');
    if (cell) {
      if (cell === openCell) closeMemo(); else openMemo(cell);
      return;
    }
    if (popEl && !e.target.closest('.memopop')) closeMemo();
  });
  /* 카드 안의 보기 전환 — 카드를 다시 그려도 살아 있도록 문서에 걸어 둡니다.
     같은 카드 안에서만 짝을 맞추므로 카드끼리 키 이름이 겹쳐도 됩니다. */
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-tab]');
    if (!b) return;
    var card = b.closest('section.card');
    if (!card) return;
    var 고른것 = b.getAttribute('data-tab');
    card.querySelectorAll('[data-tab]').forEach(function (x) {
      x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
    });
    card.querySelectorAll('[data-view]').forEach(function (v) {
      v.hidden = v.getAttribute('data-view') !== 고른것;
    });
    closeMemo();
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') closeMemo();
    if ((e.key === 'Enter' || e.key === ' ') && document.activeElement &&
        document.activeElement.classList.contains('hasmemo')) {
      e.preventDefault();
      var c = document.activeElement;
      if (c === openCell) closeMemo(); else openMemo(c);
    }
  });
  window.addEventListener('resize', function () {
    closeMemo();
    if (DATA) { stickStatRows(); fitCrossSticky(); }   /* 폭이 바뀌면 크기도 바뀝니다 */
  });

  /* ═══════════════════════════════════════════════════════
     CSV
     ═══════════════════════════════════════════════════════ */
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-csv]'); if (!b) return;
    var c = csvCache[b.dataset.csv]; if (!c) return;
    var csv = c.rows.map(function (r) {
      return r.map(function (v) {
        if (v === null || v === undefined || v === '') return '';
        var s = String(v);
        return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(',');
    }).join('\r\n');
    var blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8;' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'demo_' + c.name + '_' + (windowDates()[0] || '') + '_' + DATA.maxDate + '.csv';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
    var t = b.textContent; b.textContent = '내려받는 중…';
    setTimeout(function () { b.textContent = t; }, 1200);
  });

  /* ═══════════════════════════════════════════════════════
     상태 표시
     ═══════════════════════════════════════════════════════ */
  function showLoading(on) {
    document.getElementById('loading').style.display = on ? 'flex' : 'none';
    if (on) document.getElementById('dash').hidden = true;
  }
  function showErr(title, hint, raw) {
    document.getElementById('errSlot').innerHTML =
      '<div class="errbox"><b>' + esc(title) + '</b>' + esc(hint) +
      (raw ? '<details><summary>자세한 오류 메시지</summary><code>' + esc(raw) + '</code></details>' : '') +
      '<button class="ghost" type="button" id="retry">다시 시도</button></div>';
    var btn = document.getElementById('retry');
    if (btn) btn.onclick = loadAll;
  }
  function clearErr() { document.getElementById('errSlot').innerHTML = ''; }

  /* ── 시작 ────────────────────────────────────────────────
     실물은 로그인이 끝난 뒤에 여기까지 옵니다. */
  document.getElementById('whoEmail').textContent = '데모';
  applyView();
  loadAll();
})();
</script>
</body>
</html>
